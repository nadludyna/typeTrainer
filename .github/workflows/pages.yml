# Builds and publishes the GitHub Pages version on every push to main: the
# page built with --mode pages and the Go program as WebAssembly beside it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        run: |
          cd web && npm ci && npm run pages && cd ..
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o web/dist/page/app.wasm ./cmd/typetrainer
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/dist/page/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/page

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
