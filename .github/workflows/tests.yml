# Every check of go run ./tools/check, on every pull request that changes more
# than Markdown, with a PostgreSQL for the store's tests.
name: Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Playwright's Chromium installs on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tt
          POSTGRES_PASSWORD: tt
          POSTGRES_DB: typetrainer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TT_TEST_DATABASE_URL: postgres://tt:tt@localhost:5432/typetrainer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the page's tools
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check
        run: go run ./tools/check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-checks
          path: web/test-results/
          retention-days: 7
